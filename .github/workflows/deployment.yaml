name: Deployment-Production Parquet Lambda

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: conciliation-exporter-parquet
  ECR_REPOSITORY: conciliation-exporter-parquet


jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            .


      - name: Tag image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker tag \
            $ECR_REPOSITORY:$IMAGE_TAG \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


          docker tag \
            $ECR_REPOSITORY:$IMAGE_TAG \
            $REGISTRY/$ECR_REPOSITORY:latest


      - name: Push image to ECR
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker push \
            $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


          docker push \
            $REGISTRY/$ECR_REPOSITORY:latest


      - name: Update Lambda image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --image-uri $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      - name: Deployment Success
        run : echo "Deployment Image to ECR and Update IMAGE-URL in function success"
        





          



        


        